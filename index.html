<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aries Digitals | Digital Marketing Agency in India</title>

    <meta
      name="description"
      content="Aries Digitals is a performance-driven digital marketing agency offering social media marketing, website development, branding, and paid advertising solutions to grow your business."
    />

    <meta
      name="keywords"
      content="digital marketing agency, social media marketing, website development, branding, SEO services, Aries Digitals"
    />

    <meta name="author" content="Aries Digitals" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/Website Logo.jpg" />

    <!-- Open Graph (LinkedIn / Facebook) -->
    <meta property="og:title" content="Aries Digitals" />
    <meta
      property="og:description"
      content="Grow your business with Aries Digitals - Social Media Marketing, Web Development & Branding Experts."
    />
    <meta property="og:image" content="/Website Logo.jpg" />
    <meta property="og:url" content="https://ariesdigitals.in" />
    <meta property="og:type" content="website" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aries Digitals" />
    <meta
      name="twitter:description"
      content="Performance-driven digital marketing agency helping brands grow online."
    />
    <meta name="twitter:image" content="/Website Logo.jpg" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#a61040" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
